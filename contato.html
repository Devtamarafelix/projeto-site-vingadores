<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header-simples">
      <nav class="nav-sobre-contato">
        <img src="assets/imgs/logo.png" alt="Logo" />

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- seção titulo e paragrafo -->
      <section class="section-contato">
        <h1>Entre em contato com Os Vingadores</h1>
        <p>
          Tem alguma informação importante ou deseja enviar uma mensagem para a
          equipe? Preencha o formulário abaixo.
        </p>
      </section>
      <!-- seção formulário -->
      <section>
        <form>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" placeholder="Digite o seu nome: " />

          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Digite seu email" />

          <label for="assunto">Assunto:</label>
          <input
            type="text"
            id="assunto"
            placeholder="Sobre o que você quer falar?"
          />

          <label>Categoria:</label><br />
          <select>
            <option>Pedido de Ajuda</option>
            <option>Recrutamento</option>
            <option>Sugestão</option>
            <option>Outro</option>
          </select>

          <label>Mensagem:</label><br />
          <textarea rows="6" placeholder="Digite sua mensagem"></textarea>
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer>&copy; Central dos Vingadores</footer>
  </body>
</html>
